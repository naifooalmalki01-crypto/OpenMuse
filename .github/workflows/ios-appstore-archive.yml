name: iOS Ad Hoc archive (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ad-hoc-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    name: Build signed iOS archive
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Validate signing secrets
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$IOS_CERTIFICATE_P12_BASE64" ]] || { echo "::error::Missing secret IOS_CERTIFICATE_P12_BASE64"; exit 1; }
          [[ -n "$IOS_CERTIFICATE_PASSWORD" ]] || { echo "::error::Missing secret IOS_CERTIFICATE_PASSWORD"; exit 1; }
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || { echo "::error::Missing secret IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }

      - name: Install signing certificate and Ad Hoc profile
        id: signing
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          BUNDLE_ID: app.rain8097.diamond3440
        run: |
          set -euo pipefail
          umask 077

          keychain_path="$RUNNER_TEMP/openmuse-signing.keychain-db"
          printf 'keychain_path=%s\n' "$keychain_path" >> "$GITHUB_OUTPUT"
          certificate_path="$RUNNER_TEMP/openmuse-signing.p12"
          profile_path="$RUNNER_TEMP/openmuse-profile.mobileprovision"
          decoded_profile="$RUNNER_TEMP/openmuse-profile.plist"
          cleanup_temp_files() {
            rm -f "$certificate_path" "$profile_path" "$decoded_profile"
          }
          trap cleanup_temp_files EXIT

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          /usr/bin/security cms -D -i "$profile_path" > "$decoded_profile"

          application_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded_profile")
          profile_bundle_id="${application_identifier#*.}"
          if [[ "$profile_bundle_id" != "$BUNDLE_ID" ]]; then
            echo "::error::Provisioning profile must match bundle identifier $BUNDLE_ID"
            exit 1
          fi

          get_task_allow=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$decoded_profile" 2>/dev/null || true)
          provisions_all_devices=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$decoded_profile" 2>/dev/null || true)
          if [[ "$get_task_allow" != "false" ]] || [[ "$provisions_all_devices" == "true" ]]; then
            echo "::error::A non-development Ad Hoc provisioning profile is required"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices:0' "$decoded_profile" >/dev/null 2>&1; then
            echo "::error::An Ad Hoc provisioning profile with registered devices is required"
            exit 1
          fi

          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$decoded_profile")
          team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$decoded_profile")
          [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]+$ ]] || { echo "::error::Invalid provisioning profile UUID"; exit 1; }
          [[ "$team_id" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::Invalid team identifier in provisioning profile"; exit 1; }

          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain_path"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          /usr/bin/security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"

          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          printf 'profile_uuid=%s\n' "$profile_uuid" >> "$GITHUB_OUTPUT"
          printf 'team_id=%s\n' "$team_id" >> "$GITHUB_OUTPUT"
          cp "$profile_path" "$profile_directory/$profile_uuid.mobileprovision"

      - name: Install dependencies and generate the iOS project
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir apps/mobile exec expo prebuild --platform ios --clean --no-install
          pod install --project-directory=apps/mobile/ios

      - name: Archive and export the signed IPA
        shell: bash
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          BUNDLE_ID: app.rain8097.diamond3440
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios

          xcodebuild \
            -workspace apps/mobile/ios/OpenMuse.xcworkspace \
            -scheme OpenMuse \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/artifacts/ios/OpenMuse.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          export_options="$RUNNER_TEMP/openmuse-export-options.plist"
          cat > "$export_options" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c 'Add :method string ad-hoc' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_UUID" "$export_options"

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/artifacts/ios/OpenMuse.xcarchive" \
            -exportPath "$PWD/artifacts/ios/exported" \
            -exportOptionsPlist "$export_options"

          test -f artifacts/ios/exported/OpenMuse.ipa

      - name: Upload build artifacts (no App Store submission)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openmuse-ios-ad-hoc-archive
          path: |
            artifacts/ios/OpenMuse.xcarchive
            artifacts/ios/exported/OpenMuse.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing materials from the runner
        if: ${{ always() && steps.signing.outputs.keychain_path != '' }}
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          /usr/bin/security delete-keychain "$KEYCHAIN_PATH" || true
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
